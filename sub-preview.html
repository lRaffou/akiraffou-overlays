<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akiraffou — Aperçu alerte sub</title><style>:root{--coral:#ff405b;--cream:#ece9e2;--duration:5s}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--cream)}body{display:flex;align-items:center;justify-content:center}.follow-alert{width:calc(100% - 40px);max-width:540px;min-height:210px;position:relative;display:flex;align-items:center;gap:20px;padding:25px 28px 27px 24px;background:linear-gradient(120deg,rgba(9,18,27,.94),rgba(12,20,30,.87));border:1px solid #ff405b55;border-left:3px solid var(--coral);border-radius:8px;box-shadow:0 10px 24px #0005,inset 0 1px 0 #ffffff0b;opacity:0;visibility:hidden;transform:translateY(12px);isolation:isolate}.follow-alert.is-active{opacity:1;visibility:visible;transform:none;animation:follow-enter .42s cubic-bezier(.16,1,.3,1) both}.follow-alert.is-leaving{animation:follow-exit .3s ease-in both}.follow-alert:after{content:'';position:absolute;inset:-1px;border:1px solid #25f4ee;clip-path:inset(32% 0 58%);opacity:0;pointer-events:none;border-radius:8px}.follow-alert.is-active:after{animation:follow-glitch .7s steps(1,end) both}.follow-mark{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;border-radius:7px;background:#09121b;z-index:0;pointer-events:none}.follow-mark img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 10%}.follow-mark:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,18,27,.88) 0%,rgba(9,18,27,.80) 55%,rgba(9,18,27,.68) 100%)}.follow-copy{position:relative;z-index:1;min-width:0;flex:1;text-shadow:0 1px 3px #0009}.follow-label{color:#ff899b;font-size:11px;font-weight:800;letter-spacing:.17em;margin-bottom:10px}.follow-welcome{font-size:20px;line-height:1.25}.follow-welcome strong{display:block;font-size:28px;line-height:1.2;margin-top:3px;font-weight:800;overflow-wrap:anywhere}.follow-note{font-size:13px;color:#d6dde4;margin-top:9px;line-height:1.35}.follow-corner{position:absolute;top:0;right:0;width:12px;height:12px;background:var(--coral);clip-path:polygon(0 0,100% 0,100% 100%)}.follow-progress{position:absolute;bottom:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,var(--coral),#ff8697);transform-origin:left;opacity:.85}.is-active .follow-progress{animation:follow-progress var(--duration) linear both}@keyframes follow-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes follow-exit{to{opacity:0;transform:translateY(-8px)}}@keyframes follow-progress{to{transform:scaleX(0)}}@keyframes follow-glitch{0%,20%,29%,42%,100%{opacity:0;transform:none}21%{opacity:.7;transform:translateX(3px);clip-path:inset(32% 0 58%)}25%{opacity:.55;transform:translateX(-3px);clip-path:inset(65% 0 22%)}35%{opacity:.5;transform:translateX(2px);clip-path:inset(15% 0 75%)}}@media(prefers-reduced-motion:reduce){.follow-alert,.follow-alert:after,.follow-progress,.follow-mark{animation:none!important}.follow-alert.is-leaving{opacity:0}}
/* Floating card finish: depth 90%, reflection 70%. */
.follow-alert{border-top-color:#ffd1da80;box-shadow:0 1px 0 #ff9bb633,0 4px 0 #24101c,0 5px 0 #0c0710,0 22.8px 38px #0009,inset 0 1px 0 #ffffff44,inset 1px 0 0 #ff405b40,inset 0 -2px 0 #000c}
.follow-alert::before{content:'';position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;background:linear-gradient(145deg,#ffffff14,transparent 36%,transparent 80%,#ff405b08)}
.follow-copy,.follow-corner,.follow-progress{z-index:2}

body{background:radial-gradient(ellipse at 70% 55%,#1c202a,#09121b 70%);display:grid;place-items:center}.preview-top{position:absolute;top:7%;left:8%;right:8%;display:flex;justify-content:space-between;align-items:center;color:#a6b1bc;font-size:12px;letter-spacing:.12em}.preview-brand{font-family:Impact,'Arial Narrow',sans-serif;font-size:28px;color:#ece9e2}.preview-brand span{color:#ff405b}.preview-stage{width:min(660px,95vw);height:340px;display:flex;align-items:center;justify-content:center}.preview-controls{position:absolute;bottom:10%;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.preview-controls button{border:1px solid #ff405b70;background:#101c28;color:#ece9e2;padding:12px 18px;border-radius:5px;cursor:pointer;font:600 14px Arial}.preview-controls button:hover{background:#ff405b20}.preview-controls label{font-size:13px;color:#a6b1bc;display:flex;align-items:center;gap:8px}.preview-controls input{accent-color:#ff405b}.preview-info{position:absolute;bottom:4%;color:#778491;font-size:12px;margin:0 20px;text-align:center}
</style></head><body><header class="preview-top"><div class="preview-brand">AKIRAFFOU<span>.</span></div><div>APERÇU / ALERTE SUB</div></header><main class="preview-stage"><section id="follow-alert" class="follow-alert" aria-live="polite" aria-hidden="true">
  <div class="follow-mark" aria-hidden="true"><img src="https://lraffou.github.io/akiraffou-overlays/sub-luffy.webp" width="128" height="72" alt="" decoding="async"></div>
  <div class="follow-copy"><div class="follow-label">NOUVEAU FOLLOW</div><div class="follow-welcome"><span id="alert-lead">Bienvenue</span> <strong id="follow-name"></strong></div><div class="follow-note">Prends ta place, on est bien ici.</div></div>
  <span class="follow-corner" aria-hidden="true"></span><span class="follow-progress" aria-hidden="true"></span>
</section>
</main><div class="preview-controls"><button id="replay">Tester un sub</button><button id="resub">Tester un resub</button><button id="long-name">Tester un pseudo long</button><label><input id="sound" type="checkbox">Écouter le son</label></div><p class="preview-info">Démonstration en boucle · Dans OBS, l’alerte apparaît uniquement lors d’un sub ou resub.</p><script>(() => {
  const card = document.getElementById('follow-alert');
  const nameNode = document.getElementById('follow-name');
  const labelNode = card.querySelector('.follow-label');
  const leadNode = document.getElementById('alert-lead');
  const noteNode = card.querySelector('.follow-note');
  const imageNode = card.querySelector('.follow-mark img');
  const FOLLOW_IMAGE = 'https://lraffou.github.io/akiraffou-overlays/follow-luffy.gif';
  const SUB_IMAGE = 'https://lraffou.github.io/akiraffou-overlays/sub-luffy.webp';
  const subPreload = new Image(); subPreload.src = SUB_IMAGE;
  const RAID_IMAGE = 'https://lraffou.github.io/akiraffou-overlays/raid-luffy.gif';
  const raidPreload = new Image(); raidPreload.src = RAID_IMAGE;
  const TIP_IMAGE = 'https://lraffou.github.io/akiraffou-overlays/tip-nami.gif';
  const tipPreload = new Image(); tipPreload.src = TIP_IMAGE;
  const CHEER_IMAGE = 'https://lraffou.github.io/akiraffou-overlays/cheer-roger.gif';
  const cheerPreload = new Image(); cheerPreload.src = CHEER_IMAGE;
  let currencyCode = 'EUR';
  const queue = [];
  let busy = false, duration = 5000, soundEnabled = true, volume = .08, audio;
  let endTimer, hideTimer, nextTimer;
  const clean = value => typeof value === 'string' ? Array.from(value.trim()).slice(0, 40).join('') : '';
  const flag = value => value === true || value === 'true' || value === 1;
  const count = value => Number.isFinite(Number(value)) ? Math.max(1, Math.min(9999, Math.floor(Number(value)))) : 1;
  const follow = name => ({name, label:'NOUVEAU FOLLOW', lead:'Bienvenue', note:'Prends ta place, on est bien ici.', image:FOLLOW_IMAGE});
  function cheer(event) {
    const bits = Number(event.amount);
    if (!Number.isSafeInteger(bits) || bits <= 0) return null;
    const formatted = new Intl.NumberFormat('fr-FR').format(bits);
    return {name:clean(event.name || event.displayName) || 'Anonyme', label:'CHEER', lead:`Merci pour ${formatted} ${bits === 1 ? 'Bit' : 'Bits'}`, note:'Merci pour le soutien !', image:CHEER_IMAGE};
  }
  function tip(event) {
    const amount = Number(event.amount);
    if (!Number.isFinite(amount) || amount <= 0 || amount > Number.MAX_SAFE_INTEGER) return null;
    const formatted = new Intl.NumberFormat('fr-FR', {style:'currency', currency:currencyCode, minimumFractionDigits:2, maximumFractionDigits:2}).format(amount);
    return {name:clean(event.name || event.displayName) || 'Anonyme', label:'NOUVEAU TIP', lead:`Merci pour ${formatted}`, note:'Ça fait plaisir, merci !', image:TIP_IMAGE};
  }
  function raid(event) {
    const viewers = Number.isFinite(Number(event.amount)) ? Math.max(1, Math.floor(Number(event.amount))) : 1;
    return {name:event.name || event.displayName, label:'RAID', lead:'Bienvenue', note:viewers === 1 ? '1 personne débarque. Bienvenue à toi !' : `${viewers} personnes débarquent. Bienvenue à tous !`, image:RAID_IMAGE};
  }
  function subscriber(event) {
    if (flag(event.bulkGifted)) {
      const amount = count(event.amount);
      return {name:event.sender || event.name, label:amount > 1 ? 'SUBS OFFERTS' : 'SUB OFFERT', lead:'Merci', note:amount > 1 ? `${amount} subs offerts à la communauté !` : 'Un sub offert à la communauté !', image:SUB_IMAGE};
    }
    if (flag(event.isCommunityGift) || flag(event.playedAsCommunityGift)) return null;
    if (flag(event.gifted)) {
      const recipient = clean(event.name);
      return {name:event.sender || event.name, label:'SUB OFFERT', lead:'Merci', note:recipient ? `Un sub offert à ${recipient}.` : 'Merci pour ce sub offert !', image:SUB_IMAGE};
    }
    const months = count(event.amount);
    return {name:event.name || event.displayName, label:months > 1 ? 'RESUB' : 'NOUVEAU SUB', lead:'Merci', note:months > 1 ? `${months} mois ensemble. Merci pour ta fidélité !` : 'Merci pour ton soutien, bienvenue dans l’équipage !', image:SUB_IMAGE};
  }
  function chime() {
    if (!soundEnabled || volume <= 0) return;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audio ||= new Audio();
      audio.resume().then(() => {
        const start = audio.currentTime;
        [659.25, 880].forEach((frequency, index) => {
          const oscillator = audio.createOscillator(), gain = audio.createGain();
          const time = start + index * .095;
          oscillator.type = 'sine'; oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(volume, time + .012);
          gain.gain.exponentialRampToValueAtTime(.0001, time + .18);
          oscillator.connect(gain); gain.connect(audio.destination);
          oscillator.start(time); oscillator.stop(time + .2);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        });
      }).catch(() => {});
    } catch (_) { /* The visual alert still works if audio is unavailable. */ }
  }
  function playNext() {
    if (busy || !queue.length) return;
    busy = true;
    const alert = queue.shift();
    nameNode.textContent = alert.name;
    labelNode.textContent = alert.label;
    leadNode.textContent = alert.lead;
    noteNode.textContent = alert.note;
    if (imageNode.getAttribute('src') !== alert.image) imageNode.src = alert.image;
    imageNode.style.objectPosition = alert.image === RAID_IMAGE ? '50% 60%' : alert.image === TIP_IMAGE ? '50% 40%' : alert.image === CHEER_IMAGE ? '50% 50%' : '50% 10%';
    card.style.setProperty('--duration', `${duration}ms`);
    card.classList.remove('is-leaving');
    card.setAttribute('aria-hidden', 'false');
    card.classList.add('is-active');
    chime();
    hideTimer = setTimeout(() => card.classList.add('is-leaving'), duration - 300);
    endTimer = setTimeout(() => {
      card.classList.remove('is-active', 'is-leaving');
      card.setAttribute('aria-hidden', 'true');
      nextTimer = setTimeout(() => { busy = false; playNext(); }, 250);
    }, duration);
  }
  function enqueue(alert) {
    if (!alert) return;
    const name = clean(alert.name);
    if (!name) return;
    queue.push({...alert, name});
    playNext();
  }
  window.addEventListener('onWidgetLoad', obj => {
    const fields = obj.detail?.fieldData || {};
    const code = String(obj.detail?.currency?.code || 'EUR').toUpperCase();
    currencyCode = /^[A-Z]{3}$/.test(code) ? code : 'EUR';
    const seconds = Number(fields.durationSeconds ?? 5), level = Number(fields.soundVolume ?? 8);
    duration = (Number.isFinite(seconds) ? Math.max(3, Math.min(15, seconds)) : 5) * 1000;
    volume = (Number.isFinite(level) ? Math.max(0, Math.min(30, level)) : 8) / 100;
    soundEnabled = fields.soundEnabled !== false && fields.soundEnabled !== 'false';
    [endTimer, hideTimer, nextTimer].forEach(clearTimeout);
    queue.length = 0; busy = false;
    card.classList.remove('is-active', 'is-leaving');
    card.setAttribute('aria-hidden', 'true');
  });
  window.addEventListener('onEventReceived', obj => {
    const detail = obj.detail || {}, event = detail.event || {};
    if (detail.listener === 'follower-latest') enqueue(follow(event.name || event.displayName));
    if (detail.listener === 'subscriber-latest') enqueue(subscriber(event));
    if (detail.listener === 'raid-latest') enqueue(raid(event));
    if (detail.listener === 'tip-latest') enqueue(tip(event));
    if (detail.listener === 'cheer-latest') enqueue(cheer(event));
    if (detail.listener === 'widget-button') {
      if (event.field === 'testCheer') enqueue(cheer({name:'SuperViewer',amount:100}));
      if (event.field === 'testTip') enqueue(tip({name:'Donateur',amount:10}));
      if (event.field === 'testRaid') enqueue(raid({name:'Raideur',amount:40}));
      if (event.field === 'testFollow') enqueue(follow('NouveauViewer'));
      if (event.field === 'testSub') enqueue(subscriber({name:'NouveauSub',amount:1}));
      if (event.field === 'testResub') enqueue(subscriber({name:'FideleViewer',amount:12}));
      if (event.field === 'testGift') enqueue(subscriber({name:'Viewer',sender:'SuperGifter',amount:5,bulkGifted:true}));
    }
  });
})();
const subDemo = (name,amount=1) => window.dispatchEvent(new CustomEvent('onEventReceived',{detail:{listener:'subscriber-latest',event:{name,amount}}}));
const loadDemo = () => window.dispatchEvent(new CustomEvent('onWidgetLoad',{detail:{fieldData:{durationSeconds:5,soundEnabled:document.getElementById('sound').checked,soundVolume:8}}}));
loadDemo(); subDemo('NouveauSub');
let demoTimer = setInterval(() => subDemo('NouveauSub'), 8500);
const manualDemo = (name,amount=1) => {clearInterval(demoTimer);loadDemo();subDemo(name,amount);};
document.getElementById('replay').addEventListener('click',() => manualDemo('NouveauSub'));
document.getElementById('long-name').addEventListener('click',() => manualDemo('UnPseudoVraimentTrèsLong_12345'));
document.getElementById('resub').addEventListener('click',() => manualDemo('FideleViewer',12));
document.getElementById('sound').addEventListener('change',() => manualDemo('NouveauSub'));
</script></body></html>
